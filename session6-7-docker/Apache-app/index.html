<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apache Hello World</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #2b1d3a; color: #f9fafb;
           display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #3f2a55; padding: 40px 60px; border-radius: 12px; text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    h1 { margin: 0 0 10px; color: #d22128; }
    p { margin: 0; color: #d1d5db; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World from Apache!</h1>
    <p>Static page served by Apache httpd 2.4 inside a Docker container on port 80</p>
  </div>
</body>
</html>
