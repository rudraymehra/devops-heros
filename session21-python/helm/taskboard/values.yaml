frontend:
  image: ghcr.io/rudraymehra/campusfix-frontend
  tag: local
backend:
  image: ghcr.io/rudraymehra/campusfix-backend
  tag: local
replicaCount: 2
namespace: taskboard
imagePullSecrets: []
app:
  name: CampusFix API
  environment: development
postgres:
  host: taskboard-postgres
  database: taskboard
  username: taskboard
  password: taskboard
  storageClass: ""
  createStorageClass: false
ingress:
  enabled: false
  host: campusfix.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: false
