apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: taskboard-backend}
  template:
    metadata:
      labels: {app: taskboard-backend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports: [{containerPort: 8000}]
          env:
            - name: PG_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: PG_DATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PG_USER
              valueFrom:
                secretKeyRef: {name: taskboard-postgres, key: username}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: {name: taskboard-postgres, key: password}
          envFrom:
            - configMapRef:
                name: taskboard-config
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
