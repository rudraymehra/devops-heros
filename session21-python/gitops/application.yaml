apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campusfix
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: taskboard-backend
      jsonPointers:
        - /spec/replicas
  source:
    repoURL: https://github.com/rudraymehra/devops-heros.git
    targetRevision: main
    path: session21-python/helm/taskboard
    helm:
      releaseName: taskboard
      valueFiles:
        - ../../gitops/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
