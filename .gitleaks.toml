  '''^session-12-ingress-configmaps-secrets/04-full-demo/secret\.yaml$''',
  '''^session-12-ingress-configmaps-secrets/02-secret/README\.md$''',
  '''^session-12-ingress-configmaps-secrets/lab\.md$''',
  '''^session-12-ingress-configmaps-secrets/instructor-notes\.md 09-40-19-923\.md$''',
  '''^session-12-ingress-configmaps-secrets/instructor-notes\.md 10-38-18-235\.md$''',
