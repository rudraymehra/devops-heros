title = "devops-heros secret scanning configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Downloaded dependency caches and generated frontend output, excluded from source control"
paths = ['''(^|/)(node_modules|\.terraform|\.venv|dist)/''']

