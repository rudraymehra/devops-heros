name: Session 16 CI

on:
  push:
    branches: [main]
    paths:
      - "session-16-github-actions/session-16-github-actions/10-final-cicd-pipeline/**"
      - ".github/workflows/session16-ci.yml"
  pull_request:
    paths:
      - "session-16-github-actions/session-16-github-actions/10-final-cicd-pipeline/**"
      - ".github/workflows/session16-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: session-16-github-actions/session-16-github-actions/10-final-cicd-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: ${{ env.PROJECT_DIR }}
      - run: pytest -v
        working-directory: ${{ env.PROJECT_DIR }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: ${{ env.PROJECT_DIR }}/build/
      - run: docker build -t session16-calculator:${{ github.sha }} .
        working-directory: ${{ env.PROJECT_DIR }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/session16-calculator" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
